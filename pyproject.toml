[project]
name = "flat-search"
version = "0.1.0"
description = "A London rental search that reads the listing prose for what the portal filters cannot express."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Required. The portals challenge datacenter IPs and plain HTTP, so a real
# browser is not optional. Note that this installs the Playwright PYTHON
# package only - the Chromium binary is a separate download:
#     uv run playwright install chromium
dependencies = [
    "playwright>=1.40",
]

# Optional, and genuinely optional: fetch.py starts without these and says so.
# Without them a listing that states no size is flagged rather than having one
# read off its floorplan. The Tesseract BINARY is a system package on top of
# this - see the README.
[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flat-search = "flatsearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatsearch"]
